name: "Cleanup: GHCR Packages"

# Monthly cleanup of the GHCR packages of all images; rules and retention
# in the reusable workflow. Run manually with dry-run first to see what would
# be deleted.

on:
  schedule:
    - cron: "17 4 1 * *"  # monthly, 1st at 04:17 UTC
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Only log what would be deleted"
        type: boolean
        default: true

concurrency:
  group: cleanup-packages

permissions:
  contents: read
  packages: write

jobs:
  packages:
    runs-on: ubuntu-latest
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: List packages
        id: list
        run: |
          names=$(find images -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort | paste -sd, -)
          echo "names=${names}" >> "$GITHUB_OUTPUT"
          echo "Packages: ${names}"

  cleanup:
    needs: packages
    uses: tuxpeople/shared/.github/workflows/ghcr-cleanup.yml@10ff786fd8c8860f2c25d1accdccb58f4eb8a612 # v1.0.0
    with:
      packages: ${{ needs.packages.outputs.names }}
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
