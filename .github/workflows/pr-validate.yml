name: "PR: Validate"

on:
  pull_request:
    branches: ["main"]
    types: ["opened", "synchronize", "reopened"]
    paths:
      - "images/**"
      - ".github/workflows/**"
      - ".github/scripts/**"
      - "README.md"

concurrency:
  group: ${{ github.head_ref }}-pr-validate
  cancel-in-progress: true

jobs:
  # The image table in README.md is generated from the Dockerfile labels,
  # fail if someone added/renamed an image without re-rendering it
  readme-table:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check README image table
        run: python3 .github/scripts/render-image-table.py --check

  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: images/${{ matrix.image }}/Dockerfile
          failure-threshold: error

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has-changes: ${{ steps.set-matrix.outputs.has-changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changed images
        id: set-matrix
        run: |
          # Get changed files in PR
          changed_files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          changed_images=$(echo "$changed_files" | grep "^images/" | cut -d'/' -f2 | sort -u | jq -R -s -c 'split("\n")[:-1] | select(length > 0)')
          
          if [[ "$changed_images" == "[]" ]] || [[ -z "$changed_images" ]]; then
            echo "matrix=[]" >> $GITHUB_OUTPUT
            echo "has-changes=false" >> $GITHUB_OUTPUT
          else
            echo "matrix=$changed_images" >> $GITHUB_OUTPUT
            echo "has-changes=true" >> $GITHUB_OUTPUT
          fi
          
          echo "Changed images: $changed_images"

  build-test:
    needs: [detect-changes, lint]
    if: needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Same VERSION build-arg as build-release.yml for software-versioned
      # images (e.g. Dockerfiles that download a specific upstream release)
      - name: Determine version
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          script="images/${{ matrix.image }}/get-version.sh"
          if [[ -f "$script" ]]; then
            chmod +x "$script"
            version=$("$script")
            if [[ -z "$version" || "$version" == "null" ]]; then
              echo "::error::get-version.sh returned no version"
              exit 1
            fi
            echo "version=${version}" >> $GITHUB_OUTPUT
            echo "📦 VERSION=${version}"
          fi

      # The docker exporter behind `load: true` cannot store multi-platform
      # images, so build all platforms first and then load only amd64 (from
      # cache) for the scan and the tests.
      - name: Build image for all platforms (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./images/${{ matrix.image }}
          platforms: ${{ env.PLATFORMS }}
          push: false
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Load amd64 image for scanning and tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./images/${{ matrix.image }}
          platforms: linux/amd64
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:pr-${{ github.event.number }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          load: true

      - name: Install Trivy
        env:
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          TRIVY_VERSION: v0.76.1
        run: |
          curl -sfL "https://raw.githubusercontent.com/aquasecurity/trivy/${TRIVY_VERSION}/contrib/install.sh" | sh -s -- -b /usr/local/bin "${TRIVY_VERSION}"

      # Same filters as in build-release.yml: only fixable CVEs, plus the
      # per-image ignore file (.trivyignore.yaml or .trivyignore) if present
      - name: Run Trivy vulnerability scanner
        run: |
          ignore=()
          for f in .trivyignore.yaml .trivyignore; do
            if [[ -f "images/${{ matrix.image }}/${f}" ]]; then
              ignore=(--ignorefile "images/${{ matrix.image }}/${f}")
              break
            fi
          done
          trivy image \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            "${ignore[@]}" \
            --format table \
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:pr-${{ github.event.number }}

      # goss v0.4.10 switched to tarball release assets, which
      # e1himself/goss-installation-action cannot download.
      - name: Setup Goss
        if: hashFiles(format('images/{0}/goss.yaml', matrix.image)) != ''
        env:
          # renovate: datasource=github-releases depName=goss-org/goss
          GOSS_VERSION: v0.4.10
        shell: bash
        run: |
          base="https://github.com/goss-org/goss/releases/download/${GOSS_VERSION}"
          archive="goss_${GOSS_VERSION#v}_linux_x86_64.tar.gz"
          cd "${RUNNER_TEMP}"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/goss_${GOSS_VERSION#v}_SHA256SUMS"
          sha256sum --check --ignore-missing "goss_${GOSS_VERSION#v}_SHA256SUMS"
          curl -fsSLO "${base}/dgoss"
          curl -fsSLO "${base}/dgoss.sha256"
          sha256sum --check dgoss.sha256
          tar -xzf "${archive}" goss
          sudo install -m 0755 goss dgoss /usr/local/bin/
          goss --version

      - name: Run Goss tests
        if: hashFiles(format('images/{0}/goss.yaml', matrix.image)) != ''
        env:
          GOSS_FILE: images/${{ matrix.image }}/goss.yaml
          GOSS_OPTS: --retry-timeout 60s --sleep 2s --color --format documentation
        run: |
          dgoss run ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:pr-${{ github.event.number }}

env:
  PLATFORMS: "linux/amd64,linux/arm64"
