name: "Build & Release"

# Golden Pipeline - Best Practices from all repos
# Features: Hadolint, Trivy, Cosign, SBOM, Provenance, Multi-Arch, Auto-Tagging
#
# Auto-Versioning via Conventional Commits:
#   - feat: Minor bump (1.0.0 → 1.1.0)
#   - fix: Patch bump (1.0.0 → 1.0.1)
#   - feat! or BREAKING CHANGE: Major bump (1.0.0 → 2.0.0)
#   - First commit creates v0.1.0

on:
  release:
    types: [published]
  schedule:
    - cron: "3 3 * * *"  # Nightly builds
  push:
    branches:
      - "main"
    paths:
      - "images/**"
      - ".github/workflows/build-release.yml"
  workflow_dispatch:  # Manual trigger

env:
  PLATFORMS: "linux/amd64,linux/arm64"
  REGISTRY_GHCR: "ghcr.io"
  REGISTRY_DOCKERHUB: "docker.io"
  DOCKER_USER: "tdeutsch"

jobs:
  # Determine which images to build
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has-changes: ${{ steps.set-matrix.outputs.has-changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Required for detecting changed files

      - name: Detect changed images
        id: set-matrix
        run: |
          # List all image directories
          images=$(find images -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | jq -R -s -c 'split("\n")[:-1]')
          
          # On schedule/manual: build all
          # On push: only changed images
          if [[ "${{ github.event_name }}" == "schedule" ]] || [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "matrix=$images" >> $GITHUB_OUTPUT
            echo "has-changes=true" >> $GITHUB_OUTPUT
          else
            # Detect changed images since last push
            changed_files=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} || echo "images/")
            changed_images=$(echo "$changed_files" | grep "^images/" | cut -d'/' -f2 | sort -u | jq -R -s -c 'split("\n")[:-1] | select(length > 0)')
            
            if [[ "$changed_images" == "[]" ]] || [[ -z "$changed_images" ]]; then
              echo "matrix=[]" >> $GITHUB_OUTPUT
              echo "has-changes=false" >> $GITHUB_OUTPUT
            else
              echo "matrix=$changed_images" >> $GITHUB_OUTPUT
              echo "has-changes=true" >> $GITHUB_OUTPUT
            fi
          fi

  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    # One build per image at a time: two quick pushes used to run in
    # parallel and the older commit could push its tags last. Queue instead
    # of cancelling, a running build must finish its push/sign/release.
    concurrency:
      group: build-release-${{ matrix.image }}
      cancel-in-progress: false
    permissions:
      contents: write       # Required for creating tags and releases
      packages: write       # Required for GHCR
      id-token: write       # Required for Cosign and attestations
      security-events: write  # Required for Trivy SARIF
      attestations: write   # Required for GitHub attestations
      artifact-metadata: write  # Required for the attestation storage record
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Required for github-tag-action to analyze commits

      # ==========================================
      # PRE-BUILD: Linting & Validation
      # ==========================================
      
      - name: Run Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: images/${{ matrix.image }}/Dockerfile
          failure-threshold: error

      # ==========================================
      # SETUP: Build Environment
      # ==========================================

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install Trivy
        env:
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          TRIVY_VERSION: v0.76.1
        run: |
          curl -sfL "https://raw.githubusercontent.com/aquasecurity/trivy/${TRIVY_VERSION}/contrib/install.sh" | sh -s -- -b /usr/local/bin "${TRIVY_VERSION}"

      # ==========================================
      # METADATA: Versioning Strategy (Hybrid)
      # ==========================================
      # Images can use either:
      # 1. Build Versioning (default): Conventional Commits auto-bump
      # 2. Software Versioning (opt-in): get-version.sh prints the software
      #    version, e.g. from requirements.txt or the latest upstream release
      #    (GITHUB_TOKEN is available to avoid the API rate limit)

      - name: Determine versioning strategy
        id: version_strategy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -f "images/${{ matrix.image }}/get-version.sh" ]]; then
            echo "strategy=software" >> $GITHUB_OUTPUT
            chmod +x "images/${{ matrix.image }}/get-version.sh"
            version=$(images/${{ matrix.image }}/get-version.sh)
            if [[ -z "$version" || "$version" == "null" ]]; then
              echo "::error::get-version.sh returned no version"
              exit 1
            fi
            echo "version=$version" >> $GITHUB_OUTPUT
            echo "tag=${{ matrix.image }}-v${version}" >> $GITHUB_OUTPUT
            echo "📦 Using software versioning: ${version}"
          else
            echo "strategy=build" >> $GITHUB_OUTPUT
            echo "🔧 Using build versioning (Conventional Commits)"
          fi

      # Versions are only computed here; the git tag and the GitHub release
      # are created at the very end, after the image passed the tests and was
      # pushed. A failed build therefore never leaves a release behind.
      - name: Compute next version (build strategy)
        id: tag_version_build
        if: github.event_name == 'push' && steps.version_strategy.outputs.strategy == 'build'
        uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46 # v7.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: "${{ matrix.image }}-v"
          dry_run: true

      # new_tag:         v<version> for docker/metadata-action (semver, no prefix)
      # new_version:     the plain version, also passed as VERSION build-arg
      # semver:          true for X.Y.Z, false for anything else (git-abc1234,
      #                  1.38.0-musl+8.23.0); those get a raw tag plus latest
      # docker_version:  new_version as a valid docker tag (+ becomes -)
      # git_tag:         <image>-v<version> for the git tag and the GitHub release
      # release_created: whether this run creates a new git tag and release
      - name: Consolidate version outputs
        id: tag_version
        env:
          IMAGE: ${{ matrix.image }}
          EVENT: ${{ github.event_name }}
          STRATEGY: ${{ steps.version_strategy.outputs.strategy }}
          SOFTWARE_VERSION: ${{ steps.version_strategy.outputs.version }}
          BUILD_VERSION: ${{ steps.tag_version_build.outputs.new_version }}
        run: |
          if [[ "$STRATEGY" == "software" ]]; then
            version="$SOFTWARE_VERSION"
          elif [[ "$EVENT" == "push" ]]; then
            version="$BUILD_VERSION"
          else
            # Nightly/manual builds don't bump: rebuild the latest released
            # version, so latest and the version tags get the new base image
            latest=$(git tag -l "${IMAGE}-v*" --sort=-v:refname | head -n1)
            version="${latest#"${IMAGE}"-v}"
          fi

          git_tag="${version:+${IMAGE}-v${version//+/-}}"
          # Build versions only change with a push. Software versions also
          # change when upstream releases, which a nightly build picks up.
          release_created=false
          if [[ -n "$git_tag" ]] && ! git rev-parse -q --verify "refs/tags/${git_tag}" >/dev/null; then
            if [[ "$EVENT" == "push" || "$STRATEGY" == "software" ]]; then
              release_created=true
            fi
          fi

          semver=false
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && semver=true

          echo "new_tag=${version:+v${version}}" >> $GITHUB_OUTPUT
          echo "new_version=${version}" >> $GITHUB_OUTPUT
          echo "semver=${semver}" >> $GITHUB_OUTPUT
          echo "docker_version=${version//+/-}" >> $GITHUB_OUTPUT
          echo "git_tag=${git_tag}" >> $GITHUB_OUTPUT
          echo "release_created=${release_created}" >> $GITHUB_OUTPUT
          echo "📦 ${STRATEGY} versioning: version='${version}' git_tag='${git_tag}' release=${release_created}"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/${{ matrix.image }}
            ${{ env.REGISTRY_DOCKERHUB }}/${{ env.DOCKER_USER }}/${{ matrix.image }}
          tags: |
            type=schedule,pattern=nightly
            type=ref,event=branch
            type=ref,event=pr
            # metadata-action uses the tag with the highest priority as the
            # org.opencontainers.image.version label; without priority=2000 it
            # would be "nightly" (schedule has 1000) or "latest"
            type=semver,pattern={{version}},value=${{ steps.tag_version.outputs.new_tag }},enable=${{ steps.tag_version.outputs.semver == 'true' }},priority=2000
            type=semver,pattern=latest,value=${{ steps.tag_version.outputs.new_tag }},enable=${{ steps.tag_version.outputs.semver == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.tag_version.outputs.new_tag }},enable=${{ steps.tag_version.outputs.semver == 'true' }}
            type=semver,pattern={{major}},value=${{ steps.tag_version.outputs.new_tag }},enable=${{ steps.tag_version.outputs.semver == 'true' }}
            # Versions that are not X.Y.Z (git-abc1234, 1.38.0-musl+8.23.0):
            # the version itself plus latest, no floating major/minor tags
            type=raw,value=${{ steps.tag_version.outputs.docker_version }},enable=${{ steps.tag_version.outputs.semver == 'false' && steps.tag_version.outputs.docker_version != '' }},priority=2000
            type=raw,value=latest,enable=${{ steps.tag_version.outputs.semver == 'false' && steps.tag_version.outputs.docker_version != '' }}
            type=sha
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=Container image for ${{ matrix.image }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}

      # Per-image exceptions: images/<name>/.trivyignore.yaml (path-based,
      # e.g. secret false positives) or images/<name>/.trivyignore (CVE IDs)
      - name: Find Trivy ignore file
        id: trivyignore
        run: |
          for f in .trivyignore.yaml .trivyignore; do
            if [[ -f "images/${{ matrix.image }}/${f}" ]]; then
              echo "file=images/${{ matrix.image }}/${f}" >> $GITHUB_OUTPUT
              break
            fi
          done

      # ==========================================
      # TEST: Build locally, test before anything is published
      # ==========================================

      # The docker exporter behind `load: true` cannot store multi-platform
      # images, so test amd64 only. The push below reuses its layers.
      - name: Build amd64 image for tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./images/${{ matrix.image }}
          platforms: linux/amd64
          push: false
          load: true
          tags: local/${{ matrix.image }}:test
          build-args: |
            VERSION=${{ steps.tag_version.outputs.new_version }}
          cache-from: type=gha

      # goss v0.4.10 switched to tarball release assets, which
      # e1himself/goss-installation-action cannot download.
      - name: Setup Goss
        if: hashFiles(format('images/{0}/goss.yaml', matrix.image)) != ''
        env:
          # renovate: datasource=github-releases depName=goss-org/goss
          GOSS_VERSION: v0.4.10
        shell: bash
        run: |
          base="https://github.com/goss-org/goss/releases/download/${GOSS_VERSION}"
          archive="goss_${GOSS_VERSION#v}_linux_x86_64.tar.gz"
          cd "${RUNNER_TEMP}"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/goss_${GOSS_VERSION#v}_SHA256SUMS"
          sha256sum --check --ignore-missing "goss_${GOSS_VERSION#v}_SHA256SUMS"
          curl -fsSLO "${base}/dgoss"
          curl -fsSLO "${base}/dgoss.sha256"
          sha256sum --check dgoss.sha256
          tar -xzf "${archive}" goss
          sudo install -m 0755 goss dgoss /usr/local/bin/
          goss --version

      - name: Run Goss tests
        if: hashFiles(format('images/{0}/goss.yaml', matrix.image)) != ''
        env:
          GOSS_FILE: images/${{ matrix.image }}/goss.yaml
          GOSS_OPTS: --retry-timeout 60s --sleep 2s --color --format documentation
        run: dgoss run local/${{ matrix.image }}:test

      # For images that Goss cannot test (no shell, e.g. distroless):
      # images/<name>/test.sh gets the image reference and tests it from outside
      - name: Run test.sh
        if: hashFiles(format('images/{0}/test.sh', matrix.image)) != ''
        run: bash images/${{ matrix.image }}/test.sh local/${{ matrix.image }}:test

      - name: Run Trivy (Table Output)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/${{ matrix.image }}:test
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'
          ignore-unfixed: true
          trivyignores: ${{ steps.trivyignore.outputs.file }}

      # ==========================================
      # REGISTRY: Login
      # ==========================================

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY_DOCKERHUB }}
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ==========================================
      # BUILD: Multi-Arch with SBOM & Provenance
      # ==========================================

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./images/${{ matrix.image }}
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.tag_version.outputs.new_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true

      # ==========================================
      # SECURITY: Trivy Scan
      # ==========================================

      # limit-severities-for-sarif: without it the SARIF file contains ALL
      # severities regardless of `severity`, flooding GitHub Security.
      # ignore-unfixed: only report CVEs we can act on (a fix exists).
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: true
          ignore-unfixed: true
          trivyignores: ${{ steps.trivyignore.outputs.file }}
          exit-code: '0'  # Don't fail build, just report

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      # ==========================================
      # SIGNING: Cosign (Keyless)
      # ==========================================

      - name: Sign image with Cosign
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          images=()
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            images+=("${tag}@${DIGEST}")
          done <<< "$TAGS"
          cosign sign --yes "${images[@]}"

      # Fails right away if signing silently produced nothing usable. The
      # identity is this exact workflow on this ref, the same check users run.
      - name: Verify signature
        if: github.event_name != 'pull_request'
        run: |
          cosign verify \
            --certificate-identity "https://github.com/${{ github.workflow_ref }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}" \
            > /dev/null
          echo "✅ Signature verified"

      # ==========================================
      # ATTESTATIONS: signed provenance + SBOM (gh attestation verify)
      # ==========================================
      # BuildKit already attaches an SBOM and provenance to the image, but
      # unsigned. These are signed via Sigstore and stored in GitHub and GHCR.

      - name: Generate SBOM
        if: github.event_name != 'pull_request'
        run: |
          trivy image --quiet --format spdx-json --output sbom.spdx.json \
            "${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}"

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM
        if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      # ==========================================
      # RELEASE: Git tag + GitHub release (only after a successful push)
      # ==========================================

      # Creating the release also creates the git tag on this commit
      - name: Create GitHub release if new version
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: steps.tag_version.outputs.release_created == 'true'
        with:
          tag_name: ${{ steps.tag_version.outputs.git_tag }}
          target_commitish: ${{ github.sha }}
          name: "Release ${{ steps.tag_version.outputs.git_tag }}"
          body: |
            ${{ steps.version_strategy.outputs.strategy == 'software' && format('Software version: {0}', steps.version_strategy.outputs.version) || steps.tag_version_build.outputs.changelog }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================
      # REGISTRY: Docker Hub Description
      # ==========================================

      - name: Update Docker Hub description
        if: github.event_name != 'pull_request'
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKER_USER }}/${{ matrix.image }}
          short-description: "Container image for ${{ matrix.image }}"
          readme-filepath: ./images/${{ matrix.image }}/README.md

  # ==========================================
  # SUMMARY: Build Status
  # ==========================================

  build-summary:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check build status
        run: |
          if [[ "${{ needs.build.result }}" == "failure" ]]; then
            echo "❌ Build failed"
            exit 1
          else
            echo "✅ Build successful"
          fi
